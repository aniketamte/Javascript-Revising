      th,

        border-collapse: collapse;

      }

        <tr>

          <th>Price</th>

        <tr>
          <td>A</td>
          <td>$10</td>

        </tr>
        <tr>
          <td>B</td>
          <td>$10</td>
          <td>In stock</td>
        </tr>
      </tbody>
    </table>

</html>
